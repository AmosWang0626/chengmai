<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家谱画布 · 原型</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    background: linear-gradient(135deg, #f5f3ff 0%, #f8fafc 50%, #fdf2f8 100%);
    color: #1e293b;
  }

  /* ── 顶栏 ── */
  header {
    height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 14px;
    padding: 0 16px; background: rgba(255,255,255,.85); backdrop-filter: blur(8px);
    border-bottom: 1px solid #e2e8f0; z-index: 20;
  }
  .brand { font-weight: 700; font-size: 16px; color: #6d28d9; white-space: nowrap; }
  .brand .proto {
    font-size: 10px; font-weight: 600; color: #fff; background: #a78bfa;
    border-radius: 6px; padding: 2px 6px; margin-left: 6px; vertical-align: 2px;
  }
  #stats { font-size: 12px; color: #64748b; white-space: nowrap; }
  .search { position: relative; flex: 0 1 260px; margin-left: auto; }
  .search input {
    width: 100%; padding: 7px 12px 7px 30px; font-size: 13px;
    border: 1px solid #e2e8f0; border-radius: 10px; outline: none; background: #fff;
  }
  .search input:focus { border-color: #a78bfa; box-shadow: 0 0 0 3px rgba(167,139,250,.2); }
  .search::before { content: "⌕"; position: absolute; left: 10px; top: 50%; transform: translateY(-52%); color: #94a3b8; font-size: 15px; }
  #hitCount { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 11px; color: #a78bfa; }
  .ctl { display: flex; align-items: center; gap: 4px; }
  .ctl button {
    border: 1px solid #e2e8f0; background: #fff; border-radius: 9px; cursor: pointer;
    padding: 6px 10px; font-size: 13px; color: #475569; transition: background .15s;
  }
  .ctl button:hover { background: #f1f5f9; }
  #zoomPct { font-size: 12px; color: #64748b; min-width: 42px; text-align: center; }

  /* ── 画布 ── */
  #viewport { flex: 1; position: relative; overflow: hidden; cursor: grab; touch-action: none; }
  #viewport.dragging { cursor: grabbing; }
  #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  #world.anim { transition: transform .4s cubic-bezier(.22,.61,.36,1); }
  #lines { position: absolute; top: 0; left: 0; overflow: visible; }
  #cards { position: absolute; top: 0; left: 0; }

  /* ── 成员卡片 ── */
  .card {
    position: absolute; background: #fff; border-radius: 14px; border: 2px solid #e2e8f0;
    box-shadow: 0 1px 3px rgba(15,23,42,.08); cursor: pointer; user-select: none;
    transition: box-shadow .15s, translate .15s;
  }
  .card:hover { box-shadow: 0 6px 18px rgba(109,40,217,.16); translate: 0 -2px; }
  .card.male   { border-color: #93c5fd; }
  .card.female { border-color: #f9a8d4; }
  .card.other  { border-color: #c4b5fd; }
  .card.hit { box-shadow: 0 0 0 3px #fbbf24, 0 6px 18px rgba(251,191,36,.35); }
  .card.selected { box-shadow: 0 0 0 3px #8b5cf6, 0 6px 18px rgba(139,92,246,.3); }
  .member { display: flex; align-items: center; gap: 9px; padding: 10px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 17px;
  }
  .male .avatar   { background: linear-gradient(135deg, #60a5fa, #2563eb); }
  .female .avatar { background: linear-gradient(135deg, #f472b6, #db2777); }
  .other .avatar  { background: linear-gradient(135deg, #a78bfa, #7c3aed); }
  .info { min-width: 0; flex: 1; }
  .name { font-size: 14.5px; font-weight: 700; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name .sym { font-size: 11px; font-weight: 400; color: #94a3b8; margin-left: 3px; }
  .name .late { font-size: 9px; color: #94a3b8; border: 1px solid #cbd5e1; border-radius: 4px; padding: 0 3px; margin-left: 4px; vertical-align: 1px; }
  .badges { display: flex; gap: 4px; margin-top: 4px; }
  .badge { font-size: 10px; font-weight: 600; border-radius: 6px; padding: 1.5px 5px; white-space: nowrap; }
  .badge.gen  { background: #fef3c7; color: #b45309; }
  .badge.char { background: #ede9fe; color: #6d28d9; }
  .years { font-size: 10.5px; color: #94a3b8; margin-top: 4px; }

  /* ── 配偶卡片（独立的人）── */
  .spouse { padding: 9px 10px; background: #fafaf9; border-color: #d6d3d1; }
  .spouse .tag { font-size: 9px; font-weight: 600; color: #a8a29e; letter-spacing: 1px; }
  .spouse .name { font-size: 13.5px; margin-top: 2px; }
  .spouse .sub { font-size: 10.5px; color: #a8a29e; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spouse.hit { box-shadow: 0 0 0 3px #fbbf24; }

  /* ── 折叠按钮 ── */
  .fold {
    position: absolute; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; border: 2px solid #c4b5fd; color: #7c3aed;
    font-size: 12px; font-weight: 700; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; z-index: 5;
    transition: background .15s;
  }
  .fold:hover { background: #ede9fe; }
  .fold.closed { font-size: 9px; width: auto; min-width: 22px; padding: 0 5px; border-radius: 11px; background: #ede9fe; }

  /* ── 提示 ── */
  #hint {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    font-size: 11.5px; color: #94a3b8; background: rgba(255,255,255,.8);
    padding: 5px 14px; border-radius: 999px; pointer-events: none; white-space: nowrap;
  }

  /* ── 详情面板 ── */
  #panel {
    position: fixed; top: 68px; right: 12px; bottom: 12px; width: 300px; z-index: 30;
    background: #fff; border-radius: 16px; box-shadow: 0 12px 40px rgba(15,23,42,.18);
    border: 1px solid #e2e8f0; display: none; flex-direction: column; overflow: hidden;
  }
  #panel.open { display: flex; }
  #panel .head { padding: 16px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; gap: 10px; }
  #panel .head .avatar { width: 44px; height: 44px; font-size: 19px; }
  #panel .head h3 { font-size: 17px; }
  #panel .head .sub { font-size: 11.5px; color: #94a3b8; margin-top: 2px; }
  #panel .close { margin-left: auto; border: none; background: #f1f5f9; border-radius: 8px; width: 28px; height: 28px; cursor: pointer; color: #64748b; font-size: 14px; }
  #panel .body { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .row { display: flex; padding: 7px 0; border-bottom: 1px dashed #f1f5f9; font-size: 13px; }
  .row .k { width: 76px; flex-shrink: 0; color: #94a3b8; }
  .row .v { color: #334155; word-break: break-all; }
  #panel .foot { padding: 12px 16px; border-top: 1px solid #f1f5f9; display: flex; gap: 8px; }
  #panel .foot button {
    flex: 1; padding: 8px 0; border-radius: 10px; border: 1px solid #e2e8f0;
    background: #fff; cursor: pointer; font-size: 12.5px; color: #475569;
  }
  #panel .foot button.primary { background: #7c3aed; border-color: #7c3aed; color: #fff; }

  /* ── 登录 ── */
  #login {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; background: rgba(248,250,252,.9); backdrop-filter: blur(4px);
  }
  #login.open { display: flex; }
  #login .box { background: #fff; border-radius: 20px; padding: 32px; width: 320px; box-shadow: 0 20px 60px rgba(15,23,42,.15); }
  #login h2 { font-size: 18px; color: #6d28d9; margin-bottom: 6px; }
  #login p { font-size: 12px; color: #94a3b8; margin-bottom: 18px; }
  #login input {
    width: 100%; padding: 10px 12px; margin-bottom: 12px; font-size: 14px;
    border: 1px solid #e2e8f0; border-radius: 10px; outline: none;
  }
  #login input:focus { border-color: #a78bfa; }
  #login button {
    width: 100%; padding: 11px; border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(90deg, #7c3aed, #9333ea); color: #fff; font-size: 14px; font-weight: 600;
  }
  #login .err { color: #dc2626; font-size: 12px; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>

<header>
  <div class="brand">🌳 家谱画布<span class="proto">原型</span></div>
  <div id="stats"></div>
  <div class="search">
    <input id="search" type="text" placeholder="搜索姓名，回车定位">
    <span id="hitCount"></span>
  </div>
  <div class="ctl">
    <button id="zoomOut" title="缩小">−</button>
    <span id="zoomPct">100%</span>
    <button id="zoomIn" title="放大">＋</button>
    <button id="fit">适应全图</button>
    <button id="expandAll">全部展开</button>
  </div>
</header>

<div id="viewport">
  <div id="world">
    <svg id="lines"></svg>
    <div id="cards"></div>
  </div>
  <div id="hint">拖拽平移 · 滚轮缩放 · 点击卡片看详情 · 点圆钮折叠分支</div>
</div>

<aside id="panel">
  <div class="head">
    <div class="avatar" id="pAvatar"></div>
    <div><h3 id="pName"></h3><div class="sub" id="pSub"></div></div>
    <button class="close" id="pClose">✕</button>
  </div>
  <div class="body" id="pBody"></div>
  <div class="foot">
    <button id="pCenter" class="primary">居中显示</button>
    <button id="pFold">折叠此支</button>
  </div>
</aside>

<div id="login">
  <div class="box">
    <h2>家谱画布原型</h2>
    <p>与主应用共用登录态；若未登录请在此登录</p>
    <input id="lUser" type="text" placeholder="账号">
    <input id="lPass" type="password" placeholder="密码">
    <button id="lBtn">登录</button>
    <div class="err" id="lErr"></div>
  </div>
</div>

<script>
'use strict';

/* ───────── 常量：卡片与布局尺寸 ───────── */
const CW = 160, CH = 92;      // 成员卡
const SW = 136, SH = 84;      // 配偶卡
const MGAP = 28;              // 夫妻卡间距（婚姻线）
const GAP = 32;               // 兄弟子树间距
const LEVEL = 180;            // 世代层距
const ROOTGAP = 80;           // 支系间距
const PAD = 60;               // 画布留白

const $ = id => document.getElementById(id);
const viewport = $('viewport'), world = $('world'), linesSvg = $('lines'), cardsLayer = $('cards');

let token = localStorage.getItem('fm_token');
let members = [], roots = [], nodeById = new Map();
const collapsed = new Set();
const view = { x: 0, y: 0, s: 1 };
let worldW = 0, worldH = 0, maxDepth = 0;
let panelNode = null, panelIsSpouse = false;

/* ───────── API ───────── */
async function api(path, opts = {}) {
  const headers = {};
  if (token) headers.Authorization = 'Bearer ' + token;
  if (opts.body) headers['Content-Type'] = 'application/json';
  const res = await fetch(path, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (res.status === 401) { showLogin(); throw new Error('未登录'); }
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && data.error) || '请求失败 ' + res.status);
  return data;
}

function showLogin() { $('login').classList.add('open'); }

$('lBtn').onclick = async () => {
  $('lErr').textContent = '';
  let u = $('lUser').value.trim();
  if (!u.includes('@')) u += '@family.local';
  try {
    const data = await api('/api/auth/login', { method: 'POST', body: { username: u, password: $('lPass').value } });
    token = data.token;
    localStorage.setItem('fm_token', token);
    $('login').classList.remove('open');
    loadData();
  } catch (e) { $('lErr').textContent = e.message; }
};
$('lPass').addEventListener('keydown', e => { if (e.key === 'Enter') $('lBtn').click(); });

/* ───────── 数据与树构建 ───────── */
async function loadData() {
  try {
    members = await api('/api/members');
  } catch (e) { return; }
  buildForest();
  relayout();
  initialView();
  const gens = new Set(members.map(m => m.generation).filter(Boolean)).size;
  $('stats').textContent = `${members.length} 人 · ${gens} 世代 · ${roots.length} 支系`;
}

/* 初始视图：根节点居中、可读缩放；全貌用“适应全图” */
function initialView() {
  const r = roots[0];
  if (!r) { fit(); return; }
  view.s = 0.8;
  view.x = viewport.clientWidth / 2 - (r.x + unitW(r) / 2) * view.s;
  view.y = 60 - r.y * view.s;
  apply();
}

function buildForest() {
  nodeById = new Map(members.map(m => [m.id, { ...m, children: [] }]));
  roots = [];
  for (const n of nodeById.values()) {
    if (n.parent_id && nodeById.has(n.parent_id)) nodeById.get(n.parent_id).children.push(n);
    else roots.push(n);
  }
  const byRank = (a, b) => (a.family_rank || 0) - (b.family_rank || 0) || a.name.localeCompare(b.name, 'zh');
  for (const n of nodeById.values()) n.children.sort(byRank);
  roots.sort(byRank);
}

/* ───────── 布局：夫妻作为一个单元，子树宽度自底向上 ───────── */
const unitW = n => CW + (n.spouse_name ? MGAP + SW : 0);
const descCount = n => n.children.reduce((s, c) => s + 1 + descCount(c), 0);

function measure(n) {
  const uw = unitW(n);
  if (collapsed.has(n.id) || !n.children.length) { n.subW = uw; return; }
  n.children.forEach(measure);
  const kidsW = n.children.reduce((s, c) => s + c.subW, 0) + GAP * (n.children.length - 1);
  n.subW = Math.max(uw, kidsW);
}

function place(n, left, depth) {
  maxDepth = Math.max(maxDepth, depth);
  n.y = PAD + depth * LEVEL;
  const uw = unitW(n);
  if (collapsed.has(n.id) || !n.children.length) {
    n.x = left + (n.subW - uw) / 2;
    return;
  }
  const kidsW = n.children.reduce((s, c) => s + c.subW, 0) + GAP * (n.children.length - 1);
  let cx = left + (n.subW - kidsW) / 2;
  for (const c of n.children) { place(c, cx, depth + 1); cx += c.subW + GAP; }
  const first = n.children[0], last = n.children[n.children.length - 1];
  const childCenter = (first.x + unitW(first) / 2 + last.x + unitW(last) / 2) / 2;
  n.x = childCenter - uw / 2;
}

function relayout() {
  maxDepth = 0;
  roots.forEach(measure);
  let left = PAD;
  for (const r of roots) { place(r, left, 0); left += r.subW + ROOTGAP; }
  worldW = left - ROOTGAP + PAD;
  worldH = PAD * 2 + maxDepth * LEVEL + CH;
  render();
}

/* ───────── 渲染：SVG 连线 + HTML 卡片 ───────── */
const year = d => d ? String(d).slice(0, 4) : '';
const yearsText = m => {
  const b = year(m.birth_date), d = year(m.death_date);
  if (b && d) return `${b} – ${d}`;
  if (b) return `${b} –`;
  if (d) return `– ${d}`;
  return '生卒未知';
};
const genderClass = g => g === 'male' ? 'male' : g === 'female' ? 'female' : 'other';
const genderSym = g => g === 'male' ? '♂' : g === 'female' ? '♀' : '○';

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function render() {
  linesSvg.setAttribute('width', worldW);
  linesSvg.setAttribute('height', worldH);
  linesSvg.innerHTML = '';
  cardsLayer.innerHTML = '';

  const walk = n => {
    drawUnit(n);
    if (!collapsed.has(n.id)) n.children.forEach(walk);
  };
  roots.forEach(walk);
  applySearch();
}

function drawUnit(n) {
  const ux = n.x + unitW(n) / 2;                 // 单元中心（婚姻线中点）
  const midY = n.y + CH / 2;

  /* 婚姻线 + 爱心 */
  if (n.spouse_name) {
    linesSvg.appendChild(svgEl('line', {
      x1: n.x + CW, y1: midY, x2: n.x + CW + MGAP, y2: midY,
      stroke: '#f9a8d4', 'stroke-width': 2, 'stroke-linecap': 'round'
    }));
    const heart = svgEl('text', {
      x: n.x + CW + MGAP / 2, y: midY + 3.5,
      'text-anchor': 'middle', 'font-size': 10, fill: '#ec4899'
    });
    heart.textContent = '♥';
    linesSvg.appendChild(heart);
  }

  /* 成员卡 */
  const card = document.createElement('div');
  card.className = `card member ${genderClass(n.gender)}`;
  card.style.cssText = `left:${n.x}px;top:${n.y}px;width:${CW}px;height:${CH}px`;
  card.dataset.id = n.id;
  card.dataset.name = n.name;
  card.innerHTML = `
    <div class="avatar">${n.name.slice(-1)}</div>
    <div class="info">
      <div class="name">${n.name}<span class="sym">${genderSym(n.gender)}</span>${n.death_date ? '<span class="late">故</span>' : ''}</div>
      <div class="badges">
        <span class="badge gen">第${n.generation || '?'}世</span>
        ${n.generation_char ? `<span class="badge char">${n.generation_char}</span>` : ''}
      </div>
      <div class="years">${yearsText(n)}</div>
    </div>`;
  card.onclick = () => openPanel(n, false);
  cardsLayer.appendChild(card);

  /* 配偶卡：独立的人 */
  if (n.spouse_name) {
    const sx = n.x + CW + MGAP, sy = n.y + (CH - SH) / 2;
    const sc = document.createElement('div');
    sc.className = 'card spouse';
    sc.style.cssText = `left:${sx}px;top:${sy}px;width:${SW}px;height:${SH}px`;
    sc.dataset.id = n.id;
    sc.dataset.name = n.spouse_name;
    sc.dataset.spouse = '1';
    const sub = [n.spouse_origin, yearsText({ birth_date: n.spouse_birth_date, death_date: n.spouse_death_date })]
      .filter(s => s && s !== '生卒未知').join(' · ');
    sc.innerHTML = `
      <div class="tag">配偶</div>
      <div class="name">${n.spouse_name}${n.spouse_death_date ? '<span class="late">故</span>' : ''}</div>
      <div class="sub">${sub || '—'}</div>`;
    sc.onclick = () => openPanel(n, true);
    cardsLayer.appendChild(sc);
  }

  if (!n.children.length) return;

  /* 折叠按钮 */
  const isCollapsed = collapsed.has(n.id);
  const fold = document.createElement('button');
  fold.className = 'fold' + (isCollapsed ? ' closed' : '');
  fold.style.left = (ux - 11) + 'px';
  fold.style.top = (n.y + CH + 10) + 'px';
  fold.textContent = isCollapsed ? '+' + descCount(n) : '−';
  fold.title = isCollapsed ? '展开此支' : '折叠此支';
  fold.onclick = e => { e.stopPropagation(); toggleFold(n.id); };
  cardsLayer.appendChild(fold);

  if (isCollapsed) return;

  /* 血缘连线：婚姻线中点下垂 → 横向总线 → 各子女吊线 */
  const busY = n.children[0].y - 28;
  const startY = n.spouse_name ? midY + 8 : n.y + CH;
  const path = d => linesSvg.appendChild(svgEl('path', {
    d, fill: 'none', stroke: '#c4b5fd', 'stroke-width': 2, 'stroke-linecap': 'round'
  }));
  path(`M ${ux} ${startY} L ${ux} ${busY}`);
  const centers = n.children.map(c => c.x + unitW(c) / 2);
  if (n.children.length > 1) {
    path(`M ${Math.min(...centers)} ${busY} L ${Math.max(...centers)} ${busY}`);
  }
  n.children.forEach((c, i) => path(`M ${centers[i]} ${busY} L ${centers[i]} ${c.y}`));
}

function toggleFold(id) {
  collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
  relayout();
  if (panelNode && panelNode.id === id) syncFoldBtn();
}

/* ───────── 平移缩放 ───────── */
function apply() {
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.s})`;
  $('zoomPct').textContent = Math.round(view.s * 100) + '%';
}

function zoomAt(px, py, factor) {
  const ns = Math.min(3, Math.max(0.05, view.s * factor));
  view.x = px - (px - view.x) * (ns / view.s);
  view.y = py - (py - view.y) * (ns / view.s);
  view.s = ns;
  apply();
}

function fit() {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const s = Math.min((vw - 40) / worldW, (vh - 40) / worldH, 1);
  view.s = s;
  view.x = (vw - worldW * s) / 2;
  view.y = (vh - worldH * s) / 2;
  animateApply();
}

function animateApply() {
  world.classList.add('anim');
  apply();
  setTimeout(() => world.classList.remove('anim'), 420);
}

function centerOn(x, y) {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  if (view.s < 0.7) view.s = 0.9;
  view.x = vw / 2 - x * view.s;
  view.y = vh / 2 - y * view.s;
  animateApply();
}

viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const r = viewport.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 0.89);
}, { passive: false });

let drag = null;
viewport.addEventListener('mousedown', e => {
  if (e.target.closest('.card, .fold')) return;
  drag = { mx: e.clientX, my: e.clientY, vx: view.x, vy: view.y };
  viewport.classList.add('dragging');
});
window.addEventListener('mousemove', e => {
  if (!drag) return;
  view.x = drag.vx + e.clientX - drag.mx;
  view.y = drag.vy + e.clientY - drag.my;
  apply();
});
window.addEventListener('mouseup', () => { drag = null; viewport.classList.remove('dragging'); });

/* 触摸：单指平移，双指缩放 */
let touch = null;
viewport.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    const t = e.touches[0];
    touch = { mode: 'pan', mx: t.clientX, my: t.clientY, vx: view.x, vy: view.y };
  } else if (e.touches.length === 2) {
    const [a, b] = e.touches;
    touch = { mode: 'pinch', dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) };
  }
}, { passive: true });
viewport.addEventListener('touchmove', e => {
  if (!touch) return;
  e.preventDefault();
  if (touch.mode === 'pan' && e.touches.length === 1) {
    const t = e.touches[0];
    view.x = touch.vx + t.clientX - touch.mx;
    view.y = touch.vy + t.clientY - touch.my;
    apply();
  } else if (touch.mode === 'pinch' && e.touches.length === 2) {
    const [a, b] = e.touches;
    const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    const r = viewport.getBoundingClientRect();
    zoomAt((a.clientX + b.clientX) / 2 - r.left, (a.clientY + b.clientY) / 2 - r.top, dist / touch.dist);
    touch.dist = dist;
  }
}, { passive: false });
viewport.addEventListener('touchend', () => { touch = null; });

$('zoomIn').onclick = () => zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 1.2);
$('zoomOut').onclick = () => zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 0.83);
$('fit').onclick = fit;
$('expandAll').onclick = () => { collapsed.clear(); relayout(); };
window.addEventListener('resize', () => apply());

/* ───────── 搜索 ───────── */
let hits = [];
function applySearch() {
  const term = $('search').value.trim().toLowerCase();
  hits = [];
  document.querySelectorAll('.card').forEach(c => {
    const match = term && c.dataset.name.toLowerCase().includes(term);
    c.classList.toggle('hit', !!match);
    if (match) hits.push(c);
  });
  $('hitCount').textContent = term ? `${hits.length} 人` : '';
}
$('search').addEventListener('input', applySearch);
$('search').addEventListener('keydown', e => {
  if (e.key === 'Enter' && hits.length) {
    const c = hits[0];
    centerOn(parseFloat(c.style.left) + c.offsetWidth / 2, parseFloat(c.style.top) + c.offsetHeight / 2);
  }
});

/* ───────── 详情面板 ───────── */
function row(k, v) {
  return v ? `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>` : '';
}

function openPanel(n, isSpouse) {
  panelNode = n; panelIsSpouse = isSpouse;
  document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
  const selector = isSpouse ? `.card.spouse[data-id="${n.id}"]` : `.card.member[data-id="${n.id}"]`;
  const el = document.querySelector(selector);
  if (el) el.classList.add('selected');

  const g = isSpouse ? 'other' : genderClass(n.gender);
  $('pAvatar').className = `avatar ${g}`;
  $('pAvatar').style.background = isSpouse ? 'linear-gradient(135deg,#a8a29e,#78716c)' : '';
  $('pAvatar').textContent = (isSpouse ? n.spouse_name : n.name).slice(-1);
  $('pName').textContent = isSpouse ? n.spouse_name : n.name;
  $('pSub').textContent = isSpouse ? `${n.name} 的配偶` : `第${n.generation || '?'}世 · ${n.generation_char || '—'}字辈`;

  let html = '';
  if (isSpouse) {
    html += row('姓名', n.spouse_name);
    html += row('配偶', n.name);
    html += row('籍贯', n.spouse_origin);
    html += row('出生', n.spouse_birth_date);
    html += row('逝世', n.spouse_death_date);
  } else {
    html += row('性别', n.gender === 'male' ? '男' : n.gender === 'female' ? '女' : '其他');
    html += row('世代', `第${n.generation || '?'}世`);
    html += row('字辈', n.generation_char);
    html += row('同辈排行', n.sibling_rank ? `第${n.sibling_rank}位` : '');
    html += row('家庭排序', n.family_rank ? `第${n.family_rank}位` : '');
    html += row('出生', n.birth_date);
    html += row('逝世', n.death_date);
    html += row('电话', n.phone);
    html += row('邮箱', n.email);
    html += row('地址', n.address);
    html += row('职业', n.occupation);
    html += row('学历', n.education);
    html += row('简介', n.bio);
    html += row('配偶', n.spouse_name);
    html += row('配偶籍贯', n.spouse_origin);
    html += row('备注', n.notes);
    html += row('子女数', n.children.length ? `${n.children.length} 人` : '');
  }
  $('pBody').innerHTML = html || '<div class="row"><span class="v">暂无更多信息</span></div>';
  $('pFold').style.display = (!isSpouse && n.children.length) ? '' : 'none';
  syncFoldBtn();
  $('panel').classList.add('open');
}

function syncFoldBtn() {
  if (!panelNode) return;
  $('pFold').textContent = collapsed.has(panelNode.id) ? '展开此支' : '折叠此支';
}

$('pClose').onclick = () => {
  $('panel').classList.remove('open');
  document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
  panelNode = null;
};
$('pCenter').onclick = () => {
  if (!panelNode) return;
  const n = panelNode;
  centerOn(n.x + unitW(n) / 2, n.y + CH / 2);
};
$('pFold').onclick = () => { if (panelNode) toggleFold(panelNode.id); };
window.addEventListener('keydown', e => { if (e.key === 'Escape') $('pClose').click(); });

/* ───────── 启动 ───────── */
if (token) loadData(); else showLogin();
</script>
</body>
</html>
