name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check shell syntax
        run: bash -n backup.sh start.sh

      - name: Backend tests and package
        working-directory: backend
        run: mvn -B verify

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint, tests, typecheck and build
        working-directory: frontend
        run: |
          npm run lint
          npm run test:run
          npm run build

      - name: API smoke tests
        run: python3 tests/smoke_test.py

      - name: Verify backup and restore
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          mkdir -p "$TMP/data/uploads/gallery" "$TMP/backups"
          python3 - "$TMP/data/family.db" <<'PY'
          import sqlite3
          import sys
          from pathlib import Path
          schema = Path("backend/src/main/resources/schema.sql").read_text()
          db = sqlite3.connect(sys.argv[1])
          db.executescript(schema)
          db.close()
          PY
          printf 'test-image\n' > "$TMP/data/uploads/gallery/test.png"
          DATA_DIR="$TMP/data" ./backup.sh "$TMP/backups"
          DEST=$(find "$TMP/backups" -mindepth 1 -maxdepth 1 -type d -name 'family-data-*' -print -quit)
          test -n "$DEST"
          test -f "$DEST.zip"
          test -f "$DEST/family-data.sql"
          grep -qx 'restore_check=ok' "$DEST/manifest.txt"
          grep -qx 'upload_files=1' "$DEST/manifest.txt"
          test "$(sqlite3 "$DEST/family.db" 'PRAGMA integrity_check;')" = ok
          unzip -tq "$DEST.zip" >/dev/null
          test ! -e "$TMP/data/.backup-lock"
